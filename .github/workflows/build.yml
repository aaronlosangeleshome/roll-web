name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test (open source build)
        run: |
          xcodebuild test \
            -project Roll.xcodeproj \
            -scheme Roll \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build (App Store configuration compiles)
        run: |
          xcodebuild build \
            -project Roll.xcodeproj \
            -scheme Roll-AppStore \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
