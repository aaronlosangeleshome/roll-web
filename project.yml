name: Roll
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Two build flavours share one codebase:
#   Debug / Release                 -> open source build, every feature unlocked, no StoreKit
#   Debug-AppStore / Release-AppStore -> compiles with APP_STORE, enables paywall + StoreKit
configs:
  Debug: debug
  Release: release
  Debug-AppStore: debug
  Release-AppStore: release

# Bundle ID and signing team come from Config/Roll.xcconfig, which optionally
# includes your gitignored Config/Local.xcconfig.
configFiles:
  Debug: Config/Roll.xcconfig
  Release: Config/Roll.xcconfig
  Debug-AppStore: Config/Roll.xcconfig
  Release-AppStore: Config/Roll.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Roll:
    type: application
    platform: iOS
    sources:
      - path: Roll
        excludes:
          - Info.plist
          - Store/Products.storekit
      - path: Roll/Store/Products.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ROLL_BUNDLE_ID)
        INFOPLIST_FILE: Roll/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG APP_STORE"
        Release-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"

  RollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RollTests
    dependencies:
      - target: Roll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ROLL_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Roll:
    build:
      targets:
        Roll: all
        RollTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RollTests
    archive:
      config: Release
  Roll-AppStore:
    build:
      targets:
        Roll: all
    run:
      config: Debug-AppStore
      storeKitConfiguration: Roll/Store/Products.storekit
    archive:
      config: Release-AppStore
